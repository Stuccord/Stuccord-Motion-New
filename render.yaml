services:
  - type: web
    name: stuccord-motion-studio
    runtime: node
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NITRO_PRESET
        value: node-server
      - key: NODE_ENV
        value: production
      - key: ENABLE_DEV_MOCK_AUTH
        value: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: RENDER_WORKER_URL
        sync: false
      - key: RENDER_WORKER_SECRET
        sync: false
      - key: PUBLIC_APP_URL
        sync: false
      # Publishing: encrypts connected accounts' sign-ins (32 random bytes, base64)
      - key: PUBLISHING_TOKEN_KEY
        sync: false
      # Publishing to YouTube: a Google Cloud OAuth client (YouTube Data API v3)
      - key: YOUTUBE_CLIENT_ID
        sync: false
      - key: YOUTUBE_CLIENT_SECRET
        sync: false
      # Publishing to TikTok: a TikTok for Developers app (Login Kit + Content Posting)
      - key: TIKTOK_CLIENT_KEY
        sync: false
      - key: TIKTOK_CLIENT_SECRET
        sync: false

  - type: web
    name: stuccord-render-worker
    runtime: node
    rootDir: render-worker
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: RENDER_WORKER_SECRET
        sync: false
      # Optional: speech-to-text (ElevenLabs Scribe v2) for captions
      - key: ELEVENLABS_API_KEY
        sync: false
      # Optional: the app's address, for the once-a-minute scheduled-post tick
      - key: PUBLIC_APP_URL
        sync: false
