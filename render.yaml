services:
  - type: web
    name: stuccord-motion-studio
    runtime: node
    # --include=dev: the build tools (vite and its plugins) are dev
    # dependencies, which npm skips when NODE_ENV is production.
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    envVars:
      - key: NITRO_PRESET
        value: node-server
      - key: NODE_ENV
        value: production
      - key: ENABLE_DEV_MOCK_AUTH
        value: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_PUBLISHABLE_KEY
        sync: false
      # Largest upload in MB: 50 on Supabase Free; raise (e.g. 500) after
      # upgrading Supabase to Pro and raising its storage file size limit
      - key: VITE_MAX_UPLOAD_MB
        value: 50
      - key: RENDER_WORKER_URL
        sync: false
      - key: RENDER_WORKER_SECRET
        sync: false
      - key: PUBLIC_APP_URL
        sync: false
      # Motion Explainer: Claude plans the graphics (Anthropic API key)
      - key: ANTHROPIC_API_KEY
        sync: false
      # Motion Explainer: AI story pictures and the speaker's cartoon (Google
      # Gemini API key; its Google project needs billing turned on)
      - key: GEMINI_API_KEY
        sync: false
      # Publishing: encrypts connected accounts' sign-ins (32 random bytes, base64)
      - key: PUBLISHING_TOKEN_KEY
        sync: false
      # Publishing to YouTube: a Google Cloud OAuth client (YouTube Data API v3)
      - key: YOUTUBE_CLIENT_ID
        sync: false
      - key: YOUTUBE_CLIENT_SECRET
        sync: false
      # Publishing to TikTok: a TikTok for Developers app (Login Kit + Content Posting)
      - key: TIKTOK_CLIENT_KEY
        sync: false
      - key: TIKTOK_CLIENT_SECRET
        sync: false
      # Publishing to Instagram: a Meta app with "Instagram API with Instagram Login"
      - key: INSTAGRAM_APP_ID
        sync: false
      - key: INSTAGRAM_APP_SECRET
        sync: false

  - type: web
    name: stuccord-render-worker
    # Docker, so Remotion's headless Chrome has the system libraries it needs
    # (Motion Explainer graphics in exports). Built from the repository root,
    # since the graphics come from the app's src/motion.
    runtime: docker
    dockerfilePath: ./render-worker/Dockerfile
    dockerContext: .
    buildFilter:
      paths:
        - render-worker/**
        - src/motion/**
    healthCheckPath: /health
    envVars:
      - key: RENDER_WORKER_SECRET
        sync: false
      # Speech-to-text (captions, words for the AI graphics) and AI voices (ElevenLabs)
      - key: ELEVENLABS_API_KEY
        sync: false
      # Optional: a short AI hook line on videos without Motion Explainer
      # graphics (the same Anthropic API key as the app)
      - key: ANTHROPIC_API_KEY
        sync: false
      # Optional: the app's address, for the once-a-minute scheduled-post tick
      - key: PUBLIC_APP_URL
        sync: false
